name: "bisno"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bisno_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    networks:
      - bisno_network

  api:
    build:
      context: ../backend
      target: production
    platform: linux/amd64
    image: delciocapolo/bisno-api:latest
    profiles: ["api"]
    container_name: bisno_app
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${SERVER_PORT}/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    networks:
      - bisno_network

  client:
    build:
      context: ../frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-Bisno}
    platform: linux/amd64
    image: delciocapolo/bisno-client:latest
    container_name: bisno_client
    restart: unless-stopped
    networks:
      - bisno_network
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bisno_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bisno_network

  redis:
    image: redis:7-alpine
    container_name: bisno_redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - bisno_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bisno_amqp
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bisno_network

  evolution-api:
    build:
      context: ../lib/evolution-api
    platform: linux/amd64
    image: delciocapolo/bisno-evolution-api:latest
    container_name: bisno_evolution_api
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "${EVOLUTION_SERVER_URL}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    env_file:
      - ../lib/evolution-api/.env
    environment:
      - DATABASE_SCHEMA=${EVOLUTION_DATABASE_SCHEMA}
      - DATABASE_PROVIDER=${EVOLUTION_DATABASE_PROVIDER}
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${EVOLUTION_POSTGRES_DATABASE}?schema=${EVOLUTION_DATABASE_SCHEMA}
      - POSTGRES_DATABASE=${EVOLUTION_POSTGRES_DATABASE}
      - DATABASE_CONNECTION_CLIENT_NAME=${EVOLUTION_DATABASE_CONNECTION_CLIENT_NAME}
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - SERVER_HOST=${EVOLUTION_SERVER_HOST}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=${EVOLUTION_AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES}
      - EVOLUTION_OPERATOR_EMAIL=${EVOLUTION_EVOLUTION_OPERATOR_EMAIL}
      - AUTHENTICATION_API_KEY=${EVOLUTION_AUTHENTICATION_API_KEY}
      - CACHE_REDIS_URI=${EVOLUTION_CACHE_REDIS_URI}
      - CACHE_REDIS_PREFIX_KEY=${EVOLUTION_CACHE_REDIS_PREFIX_KEY}
      - WEBSOCKET_ENABLED=${EVOLUTION_WEBSOCKET_ENABLED}
      - WEBSOCKET_GLOBAL_EVENTS=${EVOLUTION_WEBSOCKET_GLOBAL_EVENTS}
      - WEBSOCKET_ALLOWED_HOSTS=${EVOLUTION_WEBSOCKET_ALLOWED_HOSTS}
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - bisno_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  bisno_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  evolution_instances:
